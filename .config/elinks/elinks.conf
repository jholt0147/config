## ELinks 0.20.0 configuration file

## This is ELinks configuration file. You can edit it manually,
## if you wish so; this file is edited by ELinks when you save
## options through UI, however only option values will be altered
## and missing options will be added at the end of file; if option
## is not written in this file, but in some file included from it,
## it is NOT counted as missing. Note that all your formatting,
## own comments and so on will be kept as-is.
##
## Obviously, if you don't like what ELinks is going to do with
## this file, you can change it by altering the config.saving_style
## option. Come on, aren't we friendly guys after all?



##############################
# Automatically saved options
#

## config 
#  Configuration handling options.

  ## config.saving_style_w [0|1]
  #  This is internal option used when displaying a warning about obsolete
  #  config.saving_style. You shouldn't touch it.
  set config.saving_style_w = 1


## terminal 
#  Terminal options.

  ## terminal.foot 
  #  Options specific to this terminal type (according to $TERM value).

    ## terminal.foot.strike [0|1]
    set terminal.foot.strike = 1
    ## terminal.foot.sixel [0|1]
    set terminal.foot.sixel = 1
    ## terminal.foot.transparency [0|1]
    set terminal.foot.transparency = 1
    ## terminal.foot.colors <num>
    set terminal.foot.colors = 4
    ## terminal.foot.utf_8_io [0|1]
    set terminal.foot.utf_8_io = 1
    ## terminal.foot.m11_hack [0|1]
    set terminal.foot.m11_hack = 1
    ## terminal.foot.type <num>
    set terminal.foot.type = 1


## ui 
#  User interface options.

  ## ui.language <language>
  #  Language of user interface. 'System' means that the language will be
  #  extracted from the environment dynamically.
  set ui.language = "System"





##############################
# Automatically saved options
#

## document 
#  Document options.

  ## document.cache 
  #  Cache options.

    ## document.cache.memory 
    #  Memory cache options.

      ## document.cache.memory.size <num>
      #  Memory cache size (in bytes).
      set document.cache.memory.size = 100M



  ## document.css 
  #  Options concerning how to use CSS for styling documents.

    ## document.css.enable [0|1]
    #  Enable adding of CSS style info to documents.
    set document.css.enable = 1

    ## document.css.libcss [0|1]
    #  Enable experimental code using the libcss library instead of builtin
    #  implementation.
    set document.css.libcss = 1


  ## document.html 
  #  Options concerning the display of HTML pages.

    ## document.html.display_iframes [0|1]
    #  Display iframes. This code is experimental.
    set document.html.display_iframes = 1

    ## document.html.sixel [0|1]
    #  Whether to display sixel images in html documents.
    set document.html.sixel = 1


  ## document.plain 
  #  Options concerning the display of plain text pages.

    ## document.plain.sixel [0|1]
    #  Whether to display sixel images in plain text documents.
    set document.plain.sixel = 1



## ui 
#  User interface options.

  ## ui.success_msgbox [0|1]
  #  When you pressed a [ Save ] button in some manager, this option will make
  #  sure that a box confirming success of the operation will pop up.
  set ui.success_msgbox = 0





##############################
# Automatically saved options
#

## ecmascript 
#  ECMAScript options.

  ## ecmascript.enable [0|1]
  #  Whether to run those scripts inside of documents.
  set ecmascript.enable = 1

  ## ecmascript.spidermonkey 
  #  Options specific to Spidermonkey.

    ## ecmascript.spidermonkey.memory_limit <num>
    #  Runtime memory limit in bytes.
    set ecmascript.spidermonkey.memory_limit = 256M






##############################
# Automatically saved options
#

## terminal 
#  Terminal options.

  ## terminal.xterm-kitty 
  #  Options specific to this terminal type (according to $TERM value).

    ## terminal.xterm-kitty.sixel [0|1]
    set terminal.xterm-kitty.sixel = 1
    ## terminal.xterm-kitty.transparency [0|1]
    set terminal.xterm-kitty.transparency = 1
    ## terminal.xterm-kitty.colors <num>
    set terminal.xterm-kitty.colors = 4
    ## terminal.xterm-kitty.restrict_852 [0|1]
    set terminal.xterm-kitty.restrict_852 = 1
    ## terminal.xterm-kitty.utf_8_io [0|1]
    set terminal.xterm-kitty.utf_8_io = 1
    ## terminal.xterm-kitty.m11_hack [0|1]
    set terminal.xterm-kitty.m11_hack = 1
    ## terminal.xterm-kitty.type <num>
    set terminal.xterm-kitty.type = 5


